name: publish

# 只在打 tag（v1.2.3）时触发。平时 push / PR 不会跑这个。
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# 必需：OIDC 让 npm 验证「这个请求真的来自这个仓库」
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing 需要 Node 22.14+（内置支持 npm provenance）
          node-version: 22
          registry-url: https://registry.npmjs.org

      # ---------- 关键：清掉 setup-node 塞进来的占位 token ----------
      # registry-url 会让 setup-node 往 .npmrc 写一行
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # 并注入一个占位值（日志里显示 XXXXX-XXXXX-XXXXX-XXXXX）。
      # npm 会拿这个假 token 去认证，registry 认不出是谁，于是 PUT 返回 **404**
      # （不是 401/403），日志里看着像「包不存在」，极具误导性。
      #
      # 清空它，npm 才会回落到 OIDC 那条路（provenance 签名用的就是 OIDC，那步一直是成的）。
      # 前两次 run 都是踩这个，见 run#1 / run#2 日志。
      - name: 清掉占位 NODE_AUTH_TOKEN
        run: |
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"
          # 同时把 .npmrc 里那行占位 token 注释掉，双保险
          if [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i 's|^//registry.npmjs.org/:_authToken=.*|# &|' "$NPM_CONFIG_USERCONFIG" || true
            echo "--- .npmrc ---"; cat "$NPM_CONFIG_USERCONFIG"
          fi

      # ---------- 发布前自检：一条红的就不发 ----------
      - name: 契约自检
        run: |
          for f in contract path-detect chip-detect storage-scan log-race; do
            echo "=== $f ==="
            node --test "test/$f.test.mjs"
          done

      # ---------- 版本一致性：tag、package.json、README 首条必须相同 ----------
      - name: 校验版本一致性
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          README=$(grep -oP '^### \K[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1)
          echo "tag=$TAG  package.json=$PKG  README=$README"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$README" ]; then
            echo "::error::版本不一致：tag=$TAG package.json=$PKG README=$README"
            exit 1
          fi

      # ---------- 确认包里没有多余文件 ----------
      - name: 打包清单检查
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          for bad in test/ .github/ node_modules/ .ctx-test/ backups/; do
            if grep -q "$bad" /tmp/pack.txt; then
              echo "::error::打包内容里出现了 $bad"
              exit 1
            fi
          done

      # ---------- 发布：用 OIDC，不需要任何 token ----------
      - name: Publish to npm
        # --provenance 会生成公开可验证的构建来源证明，包页面显示 Provenance 徽章。
        #
        # 刻意**不加** --access public：这个包名没有 scope（不是 @org/name），
        # 无 scope 包本来就是 public，而 npm 的发布接口收到 access 字段会返回 404
        # （不是 403），日志里看起来像「没权限」，实际是参数不被接受。
        # 第一次跑就是踩了这个，见 commit 后的日志。
        run: npm publish --provenance
